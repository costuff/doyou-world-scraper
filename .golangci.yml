version: "2"

run:
  timeout: 5m
  tests: false
  build-tags: []
  exclude-dirs:
    - vendor
    - node_modules
    - frontend

issues:
  # No files to exclude - all legacy scripts removed
  exclude-files: []
  # Maximum issues count per one linter (0 = unlimited)
  max-issues-per-linter: 0
  # Maximum count of issues with the same text (0 = unlimited)
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - unused
    - staticcheck
    - govet

linters-settings:
  errcheck:
    # Check type assertions
    check-type-assertions: true
    # Check blank assignments
    check-blank: true
  govet:
    enable-all: true
