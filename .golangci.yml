run:
  timeout: 5m
  tests: true
  build-tags: []
  skip-dirs:
    - vendor
    - node_modules
    - frontend

issues:
  # No files to exclude - all legacy scripts removed
  exclude-files: []

linters:
  disable:
    - errcheck
  enable:
    - typecheck
    - unused
    - staticcheck
    - gosimple

linters-settings:
  govet:
    enable-all: true
