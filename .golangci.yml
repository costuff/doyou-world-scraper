version: "2"

run:
  timeout: 5m
  tests: false
  build-tags: []

exclusions:
  paths:
    - vendor
    - node_modules
    - frontend

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - unused
    - staticcheck
    - govet
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
