version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doyou-api-dev
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3001"
    volumes:
      - ./data:/app/data
      - ${NAS_PATH:-/mnt/music}:/nas
      - ./test_tracks:/nas_test:ro
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      - TZ=${TZ:-Europe/Athens}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doyou-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
