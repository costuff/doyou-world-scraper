services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-costuff}/doyou-world-scraper-api:latest
    container_name: doyou-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3001"
    volumes:
      - ./csv:/app/csv
      - ./downloads:/app/downloads
      - ${NAS_PATH:-/mnt/music}:/nas
      - ./test_tracks:/nas_test:ro
      - ./data:/app/data
    environment:
      - PORT=3001
      - TZ=${TZ:-Europe/Athens}
    networks:
      doyou-network:
        aliases:
          - api
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-costuff}/doyou-world-scraper-frontend:latest
    container_name: doyou-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      doyou-network:
        aliases:
          - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: doyou-cloudflared
    restart: unless-stopped
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ./tunnel-credentials.json:/etc/cloudflared/credentials.json:ro
    command: tunnel --config /etc/cloudflared/config.yml run
    networks:
      - doyou-network

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 300

networks:
  doyou-network:
    driver: bridge
