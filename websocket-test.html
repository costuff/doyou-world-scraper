<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoYou World Radio - WebSocket Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        h1 {
            color: #4CAF50;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .status.connected {
            background: #1b5e20;
            color: #a5d6a7;
        }
        .status.disconnected {
            background: #b71c1c;
            color: #ef9a9a;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .log {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #4CAF50;
            padding-left: 10px;
        }
        .log-entry.update {
            border-left-color: #2196F3;
        }
        .log-entry.complete {
            border-left-color: #4CAF50;
        }
        .log-entry.failed {
            border-left-color: #f44336;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .job-card {
            background: #333;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            border-left: 4px solid #4CAF50;
        }
        .job-card.running {
            border-left-color: #2196F3;
        }
        .job-card.completed {
            border-left-color: #4CAF50;
        }
        .job-card.failed {
            border-left-color: #f44336;
        }
        .job-id {
            font-size: 11px;
            color: #888;
            font-family: monospace;
        }
        input {
            padding: 8px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #e0e0e0;
            border-radius: 4px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>🎵 DoYou World Radio - WebSocket Test</h1>
    
    <div class="status" id="status">Disconnected</div>
    
    <div class="container">
        <div class="panel">
            <h2>🎬 Actions</h2>
            <div>
                <h3>Scrape Single Date</h3>
                <input type="date" id="scrapeDate" value="2026-01-28">
                <button onclick="scrapeDate()">Scrape Date</button>
            </div>
            <div>
                <h3>Scrape Month</h3>
                <input type="month" id="scrapeMonth" value="2026-01">
                <button onclick="scrapeMonth()">Scrape Month</button>
            </div>
            <div style="margin-top: 20px;">
                <button onclick="clearLogs()">Clear Logs</button>
                <button onclick="reconnect()">Reconnect WebSocket</button>
            </div>
        </div>
        
        <div class="panel">
            <h2>📊 Active Jobs</h2>
            <div id="jobs"></div>
        </div>
    </div>
    
    <div class="panel" style="margin-top: 20px;">
        <h2>📜 WebSocket Log</h2>
        <div class="log" id="log"></div>
    </div>

    <script>
        let ws;
        let jobs = {};

        function connect() {
            ws = new WebSocket('ws://localhost:3000/api/v1/ws');
            
            ws.onopen = () => {
                log('✅ Connected to WebSocket', 'connected');
                document.getElementById('status').className = 'status connected';
                document.getElementById('status').textContent = '✅ Connected';
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                log(`📨 Received: ${data.type}`, 'message');
                
                if (data.type === 'job_update') {
                    updateJob(data.data);
                }
            };
            
            ws.onerror = (error) => {
                log(`❌ WebSocket error: ${error}`, 'error');
            };
            
            ws.onclose = () => {
                log('🔌 Disconnected from WebSocket', 'disconnected');
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').textContent = '🔌 Disconnected';
                setTimeout(connect, 3000); // Auto-reconnect
            };
        }

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateJob(jobData) {
            jobs[jobData.id] = jobData;
            renderJobs();
            
            const statusEmoji = {
                'running': '🔄',
                'completed': '✅',
                'failed': '❌'
            }[jobData.status] || '⏳';
            
            log(`${statusEmoji} Job ${jobData.type}: ${jobData.status} (${jobData.progress}%)`, jobData.status);
        }

        function renderJobs() {
            const jobsDiv = document.getElementById('jobs');
            jobsDiv.innerHTML = '';
            
            Object.values(jobs).reverse().slice(0, 5).forEach(job => {
                const card = document.createElement('div');
                card.className = `job-card ${job.status}`;
                
                const statusEmoji = {
                    'running': '🔄',
                    'completed': '✅',
                    'failed': '❌'
                }[job.status] || '⏳';
                
                card.innerHTML = `
                    <div><strong>${statusEmoji} ${job.type}</strong></div>
                    <div class="job-id">ID: ${job.id}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${job.progress}%">
                            ${job.progress}%
                        </div>
                    </div>
                    <div style="font-size: 12px; color: #888;">
                        Status: ${job.status}
                        ${job.error ? `<br>Error: ${job.error}` : ''}
                        ${job.result ? `<br>Result: ${JSON.stringify(job.result)}` : ''}
                    </div>
                `;
                jobsDiv.appendChild(card);
            });
        }

        async function scrapeDate() {
            const date = document.getElementById('scrapeDate').value;
            log(`🚀 Starting scrape for date: ${date}`, 'info');
            
            try {
                const response = await fetch('http://localhost:3000/api/v1/scrape/date', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date })
                });
                const data = await response.json();
                log(`✅ Job created: ${data.job.id}`, 'success');
                updateJob(data.job);
            } catch (error) {
                log(`❌ Error: ${error}`, 'error');
            }
        }

        async function scrapeMonth() {
            const month = document.getElementById('scrapeMonth').value;
            log(`🚀 Starting scrape for month: ${month}`, 'info');
            
            try {
                const response = await fetch('http://localhost:3000/api/v1/scrape/month', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ month })
                });
                const data = await response.json();
                log(`✅ Job created: ${data.job.id}`, 'success');
                updateJob(data.job);
            } catch (error) {
                log(`❌ Error: ${error}`, 'error');
            }
        }

        function clearLogs() {
            document.getElementById('log').innerHTML = '';
        }

        function reconnect() {
            if (ws) {
                ws.close();
            }
            connect();
        }

        // Connect on page load
        connect();
    </script>
</body>
</html>
